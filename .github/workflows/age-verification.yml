name: Age Verification Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verify-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run age verification tests
        run: npm run test:age-verification